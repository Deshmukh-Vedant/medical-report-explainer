<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Reset your MedExplain AI account password. Enter your email to receive a secure reset link." />
<title>Forgot Password — MedExplain AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/auth.css" rel="stylesheet">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><i class="bi bi-lock-fill"></i></div>
    <h3 class="auth-title">Forgot Password?</h3>
    <p class="auth-subtitle">Enter your email address and we'll send you a secure reset link.</p>

    <div id="successMessage" class="alert" style="display:none; background:rgba(22,163,74,0.08); border:1px solid rgba(22,163,74,0.25); color:#16a34a; border-radius:14px; padding:16px 20px; font-size:0.92rem; font-weight:500; margin-bottom:16px;">
      <i class="bi bi-check-circle-fill me-2"></i>
      If your email is registered, a reset link has been sent. Please check your inbox and spam folder.
    </div>

    <form id="forgotForm" novalidate>
      <div class="floating-input">
        <input type="email" id="forgotEmail" placeholder=" " required />
        <label for="forgotEmail">Email address</label>
        <div class="field-error" id="forgotEmailError">Please enter a valid email address.</div>
      </div>

      <button type="submit" class="btn btn-brand w-100 mt-2" id="forgotSubmitBtn">
        <span id="forgotSpinner" class="spinner-border spinner-border-sm me-2" style="display:none;"></span>
        Send Reset Link
      </button>
    </form>

    <div class="auth-divider">Remembered it?</div>
    <div class="auth-footer-link">
      <a href="login.html"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const emailEl = document.getElementById('forgotEmail');
    const errEl = document.getElementById('forgotEmailError');
    const successEl = document.getElementById('successMessage');
    const submitBtn = document.getElementById('forgotSubmitBtn');
    const spinner = document.getElementById('forgotSpinner');

    const emailVal = emailEl.value.trim();
    if (!emailVal.includes('@') || emailVal.length < 5) {
      errEl.classList.add('visible');
      return;
    }
    errEl.classList.remove('visible');

    submitBtn.disabled = true;
    spinner.style.display = 'inline-block';

    try {
      const response = await fetch(`${API_BASE_URL}/forgot-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: emailVal }),
      });
      const data = await response.json();
      if (!response.ok) {
        showToast(data.detail || 'Something went wrong. Please try again.', 'error');
      } else {
        document.getElementById('forgotForm').style.display = 'none';
        successEl.style.display = 'block';
      }
    } catch (err) {
      showToast('Network error. Is the backend server running?', 'error');
    } finally {
      submitBtn.disabled = false;
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
