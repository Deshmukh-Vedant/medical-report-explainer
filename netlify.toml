# Netlify configuration for MedExplain AI (Static Frontend)
[build]
  publish = "medical-report-explainer/frontend"
  command = "echo 'Static site: no build required'"

# Prevent Netlify from running any package manager / pip install
[build.environment]
  NETLIFY_USE_YARN = "false"

# Security & CORS Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fallback proxy for API endpoints if using relative requests
[[redirects]]
  from = "/api/*"
  to = "https://medical-report-explainer-backend.onrender.com/:splat"
  status = 200
  force = true
