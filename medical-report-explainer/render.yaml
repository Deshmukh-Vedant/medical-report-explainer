services:
  - type: web
    name: medical-report-explainer-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd backend && python -m ml.train
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: RESET_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: MAX_UPLOAD_MB
        value: 20
      - key: DATABASE_URL
        value: sqlite:///./medical_reports.db
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        value: noreply@medexplain.ai
