<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Set a new secure password for your MedExplain AI account." />
<title>Reset Password — MedExplain AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<link href="css/auth.css" rel="stylesheet">
<style>
  .password-strength-bar {
    height: 4px;
    border-radius: 4px;
    background: #e2e8f0;
    margin-top: 6px;
    overflow: hidden;
  }
  .password-strength-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.3s ease, background 0.3s ease;
    width: 0%;
  }
  .strength-weak { background: #dc2626; }
  .strength-fair { background: #d97706; }
  .strength-good { background: #16a34a; }
  .strength-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><i class="bi bi-shield-lock-fill"></i></div>
    <h3 class="auth-title">Reset Password</h3>
    <p class="auth-subtitle">Choose a new secure password for your account.</p>

    <div id="invalidTokenMsg" style="display:none;" class="text-center">
      <div class="alert" style="background:rgba(220,38,38,0.08); border:1px solid rgba(220,38,38,0.25); color:#dc2626; border-radius:14px; padding:16px; font-size:0.9rem;">
        <i class="bi bi-exclamation-circle-fill me-2"></i>
        This reset link is invalid or missing. Please request a new one.
      </div>
      <a href="forgot_password.html" class="btn btn-brand mt-3">Request New Link</a>
    </div>

    <form id="resetForm" novalidate>
      <div class="floating-input">
        <input type="password" id="newPassword" placeholder=" " required minlength="8" />
        <label for="newPassword">New password</label>
        <div class="password-strength-bar"><div class="password-strength-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel"></div>
        <div class="field-error" id="newPasswordError">Password must be at least 8 characters.</div>
      </div>

      <div class="floating-input mt-3">
        <input type="password" id="confirmPassword" placeholder=" " required minlength="8" />
        <label for="confirmPassword">Confirm new password</label>
        <div class="field-error" id="confirmPasswordError">Passwords do not match.</div>
      </div>

      <button type="submit" class="btn btn-brand w-100 mt-3" id="resetSubmitBtn">
        <span id="resetSpinner" class="spinner-border spinner-border-sm me-2" style="display:none;"></span>
        Set New Password
      </button>
    </form>

    <div class="auth-footer-link mt-3">
      <a href="login.html"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/main.js"></script>
<script>
  // Extract token from URL query string
  const urlParams = new URLSearchParams(window.location.search);
  const resetToken = urlParams.get('token');

  if (!resetToken) {
    document.getElementById('resetForm').style.display = 'none';
    document.getElementById('invalidTokenMsg').style.display = 'block';
  }

  // Password strength meter
  document.getElementById('newPassword').addEventListener('input', function() {
    const val = this.value;
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    let strength = 0;
    if (val.length >= 8) strength++;
    if (/[A-Z]/.test(val)) strength++;
    if (/[0-9]/.test(val)) strength++;
    if (/[^A-Za-z0-9]/.test(val)) strength++;

    const widths = ['0%', '30%', '55%', '80%', '100%'];
    const classes = ['', 'strength-weak', 'strength-fair', 'strength-good', 'strength-good'];
    const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

    fill.style.width = widths[strength];
    fill.className = `password-strength-fill ${classes[strength]}`;
    label.textContent = val.length ? labels[strength] : '';
  });

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPwd = document.getElementById('newPassword').value;
    const confirmPwd = document.getElementById('confirmPassword').value;
    let valid = true;

    if (newPwd.length < 8) {
      document.getElementById('newPasswordError').classList.add('visible');
      valid = false;
    } else {
      document.getElementById('newPasswordError').classList.remove('visible');
    }

    if (newPwd !== confirmPwd) {
      document.getElementById('confirmPasswordError').classList.add('visible');
      valid = false;
    } else {
      document.getElementById('confirmPasswordError').classList.remove('visible');
    }

    if (!valid) return;

    const submitBtn = document.getElementById('resetSubmitBtn');
    const spinner = document.getElementById('resetSpinner');
    submitBtn.disabled = true;
    spinner.style.display = 'inline-block';

    try {
      const response = await fetch(`${API_BASE_URL}/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token: resetToken,
          new_password: newPwd,
          confirm_password: confirmPwd,
        }),
      });
      const data = await response.json();
      if (!response.ok) {
        showToast(data.detail || 'Reset failed. The link may have expired.', 'error');
      } else {
        showToast('Password reset successfully! Redirecting to login...', 'success');
        setTimeout(() => window.location.href = 'login.html', 2000);
      }
    } catch (err) {
      showToast('Network error. Is the backend server running?', 'error');
    } finally {
      submitBtn.disabled = false;
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
